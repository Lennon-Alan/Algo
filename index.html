<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramo de Flores Interactivo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #87CEEB 0%, #98FB98 50%, #F0E68C 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', serif;
            overflow: hidden;
        }
        
        #canvas {
            border: 3px solid #8B4513;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            cursor: crosshair;
            transition: transform 0.3s ease;
        }
        
        #canvas:hover {
            transform: scale(1.01);
        }
        
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #2F4F4F;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
            background: rgba(255,255,255,0.9);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .flower-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 200px;
        }
        
        .flower-selector h3 {
            margin: 0 0 10px 0;
            color: #2F4F4F;
            text-align: center;
            font-size: 18px;
        }
        
        .flower-type {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.5);
        }
        
        .flower-type:hover {
            background: rgba(255,215,0,0.2);
            border-color: #FFD700;
            transform: scale(1.05);
        }
        
        .flower-type.selected {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border-color: #FF8C00;
            box-shadow: 0 5px 15px rgba(255,140,0,0.3);
        }
        
        .flower-preview {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .flower-name {
            font-weight: bold;
            color: #2F4F4F;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
        
        button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border: 2px solid #FF8C00;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            color: #8B4513;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        button:hover {
            background: linear-gradient(135deg, #FFA500, #FF8C00);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        
        button:active {
            transform: translateY(-1px);
        }
        
        .growing-indicator {
            position: absolute;
            pointer-events: none;
            color: #32CD32;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: growPulse 0.8s ease-out;
        }
        
        @keyframes growPulse {
            0% { 
                transform: scale(0) rotate(0deg); 
                opacity: 1; 
            }
            50% { 
                transform: scale(1.5) rotate(180deg); 
                opacity: 0.8; 
            }
            100% { 
                transform: scale(1) rotate(360deg); 
                opacity: 0; 
            }
        }
        
        .flower-counter {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255,255,255,0.9);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            color: #2F4F4F;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="info">
        🌺 <strong>Creador de Ramos</strong><br>
        Selecciona un tipo de flor y haz clic<br>
        en el lienzo para plantarla
    </div>
    
    <div class="flower-selector">
        <h3>🌸 Tipos de Flores</h3>
        <div class="flower-type selected" data-flower="girasol">
            <div class="flower-preview" style="background: #FFD700;">🌻</div>
            <span class="flower-name">Girasol</span>
        </div>
        <div class="flower-type" data-flower="rosa">
            <div class="flower-preview" style="background: #FF69B4;">🌹</div>
            <span class="flower-name">Rosa</span>
        </div>
        <div class="flower-type" data-flower="tulipan">
            <div class="flower-preview" style="background: #FF6347;">🌷</div>
            <span class="flower-name">Tulipán</span>
        </div>
        <div class="flower-type" data-flower="margarita">
            <div class="flower-preview" style="background: #FFF;">🌼</div>
            <span class="flower-name">Margarita</span>
        </div>
        <div class="flower-type" data-flower="loto">
            <div class="flower-preview" style="background: #DDA0DD;">🪷</div>
            <span class="flower-name">Loto</span>
        </div>
        <div class="flower-type" data-flower="hibisco">
            <div class="flower-preview" style="background: #FF4500;">🌺</div>
            <span class="flower-name">Hibisco</span>
        </div>
    </div>
    
    <canvas id="canvas" width="800" height="600"></canvas>
    
    <div class="flower-counter">
        <div>🌸 Flores plantadas: <span id="flowerCount">7</span></div>
        <div>🎨 Tipo actual: <span id="currentType">Girasol</span></div>
    </div>
    
    <div class="controls">
        <button onclick="regenerateFlowers()">🌱 Nuevo Jardín</button>
        <button onclick="toggleAnimation()">⏯️ Pausar/Reanudar</button>
        <button onclick="changeBackground()">🎨 Cambiar Fondo</button>
        <button onclick="clearGarden()">🗑️ Limpiar Todo</button>
    </div>

    <script>
        // Variables globales
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let animationId;
        let isAnimating = true;
        let flowers = [];
        let particles = [];
        let time = 0;
        let selectedFlowerType = 'girasol';
        let backgroundColors = [
            ['#87CEEB', '#98FB98', '#F0E68C'],
            ['#FFB6C1', '#FFF8DC', '#E6E6FA'],
            ['#F0F8FF', '#FFFAF0', '#F5FFFA'],
            ['#FFEFD5', '#FFE4E1', '#F0FFF0'],
            ['#E0FFFF', '#F0FFF0', '#FFFAF0']
        ];
        let currentBg = 0;

        // Configuraciones de tipos de flores
        const flowerConfigs = {
            girasol: {
                hue: [45, 65],
                petalCount: [12, 16],
                petalSize: [20, 30],
                centerSize: [12, 18],
                colors: {
                    petal: ['#FFD700', '#FFA500', '#FF8C00'],
                    center: ['#8B4513', '#A0522D', '#CD853F']
                },
                emoji: '🌻',
                name: 'Girasol'
            },
            rosa: {
                hue: [320, 360],
                petalCount: [8, 12],
                petalSize: [15, 25],
                centerSize: [6, 10],
                colors: {
                    petal: ['#FF69B4', '#FF1493', '#DC143C'],
                    center: ['#FFB6C1', '#FFC0CB', '#F08080']
                },
                emoji: '🌹',
                name: 'Rosa'
            },
            tulipan: {
                hue: [0, 30],
                petalCount: [6, 8],
                petalSize: [18, 28],
                centerSize: [4, 8],
                colors: {
                    petal: ['#FF6347', '#FF4500', '#FF0000'],
                    center: ['#000000', '#2F4F4F', '#696969']
                },
                emoji: '🌷',
                name: 'Tulipán'
            },
            margarita: {
                hue: [0, 0],
                petalCount: [16, 20],
                petalSize: [12, 18],
                centerSize: [8, 12],
                colors: {
                    petal: ['#FFFFFF', '#FFFAF0', '#F5F5F5'],
                    center: ['#FFD700', '#FFA500', '#FF8C00']
                },
                emoji: '🌼',
                name: 'Margarita'
            },
            loto: {
                hue: [280, 320],
                petalCount: [12, 16],
                petalSize: [16, 24],
                centerSize: [10, 14],
                colors: {
                    petal: ['#DDA0DD', '#DA70D6', '#BA55D3'],
                    center: ['#FFD700', '#FFA500', '#FF6347']
                },
                emoji: '🪷',
                name: 'Loto'
            },
            hibisco: {
                hue: [10, 40],
                petalCount: [5, 7],
                petalSize: [25, 35],
                centerSize: [6, 12],
                colors: {
                    petal: ['#FF4500', '#FF6347', '#FF7F50'],
                    center: ['#8B0000', '#B22222', '#DC143C']
                },
                emoji: '🌺',
                name: 'Hibisco'
            }
        };

        // Clase para representar una flor con animación de crecimiento
        class Flower {
            constructor(x, y, type, size = 1) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.config = flowerConfigs[type];
                this.baseSize = size;
                this.currentSize = 0;
                this.targetSize = size;
                this.growing = true;
                this.growthSpeed = 0.05;
                
                // Propiedades específicas del tipo de flor
                const config = this.config;
                this.stemHeight = 80 + Math.random() * 60;
                this.petalCount = config.petalCount[0] + Math.floor(Math.random() * (config.petalCount[1] - config.petalCount[0]));
                this.petalSize = config.petalSize[0] + Math.random() * (config.petalSize[1] - config.petalSize[0]);
                this.centerSize = config.centerSize[0] + Math.random() * (config.centerSize[1] - config.centerSize[0]);
                
                this.rotation = Math.random() * Math.PI * 2;
                this.bobOffset = Math.random() * Math.PI * 2;
                this.leafOffset = Math.random() * 40 + 20;
                
                // Colores aleatorios del tipo
                this.petalColor = config.colors.petal[Math.floor(Math.random() * config.colors.petal.length)];
                this.centerColor = config.colors.center[Math.floor(Math.random() * config.colors.center.length)];
            }

            update() {
                if (this.growing && this.currentSize < this.targetSize) {
                    this.currentSize += this.growthSpeed;
                    if (this.currentSize >= this.targetSize) {
                        this.currentSize = this.targetSize;
                        this.growing = false;
                        // Crear partículas cuando termina de crecer
                        this.createGrowthParticles();
                    }
                }
            }

            createGrowthParticles() {
                for (let i = 0; i < 15; i++) {
                    particles.push(new Particle(
                        this.x + (Math.random() - 0.5) * 40, 
                        this.y - this.stemHeight + (Math.random() - 0.5) * 20,
                        this.petalColor
                    ));
                }
            }

            draw() {
                if (this.currentSize <= 0) return;
                
                ctx.save();
                
                // Efecto de balanceo suave
                const bob = Math.sin(time * 0.002 + this.bobOffset) * 2;
                const growthBob = this.growing ? Math.sin(time * 0.1) * 3 : 0;
                
                // Dibujar tallo
                this.drawStem(bob + growthBob);
                
                // Dibujar hojas
                this.drawLeaves(bob + growthBob);
                
                // Dibujar flor
                ctx.translate(this.x, this.y - this.stemHeight + bob + growthBob);
                ctx.rotate(this.rotation + Math.sin(time * 0.001) * 0.1);
                ctx.scale(this.currentSize, this.currentSize);
                
                // Pétalos
                this.drawPetals();
                
                // Centro de la flor
                this.drawCenter();
                
                ctx.restore();
            }

            drawStem(bob) {
                const stemAlpha = Math.min(this.currentSize, 1);
                ctx.save();
                ctx.globalAlpha = stemAlpha;
                
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                
                const controlX = this.x + Math.sin(time * 0.001 + this.bobOffset) * 5;
                const controlY = this.y - (this.stemHeight * this.currentSize) / 2;
                ctx.quadraticCurveTo(
                    controlX, 
                    controlY, 
                    this.x, 
                    this.y - this.stemHeight * this.currentSize + bob
                );
                
                ctx.strokeStyle = '#228B22';
                ctx.lineWidth = 4 * Math.min(this.currentSize, 1);
                ctx.lineCap = 'round';
                ctx.stroke();
                ctx.restore();
            }

            drawLeaves(bob) {
                const leafAlpha = Math.min(this.currentSize * 1.2, 1);
                ctx.save();
                ctx.globalAlpha = leafAlpha;
                
                // Hoja izquierda
                ctx.save();
                ctx.translate(this.x - 5, this.y - this.leafOffset * this.currentSize + bob * 0.5);
                ctx.rotate(-0.3);
                ctx.scale(this.currentSize, this.currentSize);
                
                ctx.beginPath();
                ctx.ellipse(0, 0, 8, 20, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#32CD32';
                ctx.fill();
                ctx.strokeStyle = '#228B22';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.restore();

                // Hoja derecha
                ctx.save();
                ctx.translate(this.x + 5, this.y - (this.leafOffset - 10) * this.currentSize + bob * 0.5);
                ctx.rotate(0.3);
                ctx.scale(this.currentSize, this.currentSize);
                
                ctx.beginPath();
                ctx.ellipse(0, 0, 8, 20, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#32CD32';
                ctx.fill();
                ctx.strokeStyle = '#228B22';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.restore();
                
                ctx.restore();
            }

            drawPetals() {
                for (let i = 0; i < this.petalCount; i++) {
                    const angle = (i / this.petalCount) * Math.PI * 2;
                    
                    ctx.save();
                    ctx.rotate(angle);
                    
                    // Gradiente específico del tipo de flor
                    const gradient = ctx.createRadialGradient(0, -this.petalSize, 0, 0, -this.petalSize, this.petalSize);
                    
                    if (this.type === 'margarita') {
                        gradient.addColorStop(0, this.petalColor);
                        gradient.addColorStop(0.7, '#F0F0F0');
                        gradient.addColorStop(1, '#E0E0E0');
                    } else {
                        gradient.addColorStop(0, this.petalColor);
                        gradient.addColorStop(0.7, this.petalColor + '88');
                        gradient.addColorStop(1, this.petalColor + '66');
                    }
                    
                    // Forma específica según el tipo
                    ctx.beginPath();
                    if (this.type === 'tulipan') {
                        // Pétalos más puntiagudos para tulipanes
                        ctx.ellipse(0, -this.petalSize * 0.8, this.petalSize * 0.4, this.petalSize * 1.2, 0, 0, Math.PI * 2);
                    } else if (this.type === 'hibisco') {
                        // Pétalos más anchos para hibisco
                        ctx.ellipse(0, -this.petalSize * 0.6, this.petalSize * 0.8, this.petalSize, 0, 0, Math.PI * 2);
                    } else {
                        // Forma estándar
                        ctx.ellipse(0, -this.petalSize, this.petalSize * 0.6, this.petalSize, 0, 0, Math.PI * 2);
                    }
                    
                    ctx.fillStyle = gradient;
                    ctx.fill();
                    
                    // Contorno
                    ctx.strokeStyle = this.petalColor;
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    
                    ctx.restore();
                }
            }

            drawCenter() {
                // Centro específico del tipo
                const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, this.centerSize);
                gradient.addColorStop(0, this.centerColor);
                gradient.addColorStop(0.6, this.centerColor + '88');
                gradient.addColorStop(1, this.centerColor + '44');
                
                ctx.beginPath();
                ctx.arc(0, 0, this.centerSize, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
                
                // Detalles del centro según el tipo
                if (this.type === 'girasol' || this.type === 'margarita') {
                    ctx.fillStyle = '#4B0000';
                    for (let i = 0; i < 12; i++) {
                        const angle = (i / 12) * Math.PI * 2;
                        const x = Math.cos(angle) * (this.centerSize * 0.6);
                        const y = Math.sin(angle) * (this.centerSize * 0.6);
                        ctx.fillRect(x - 0.5, y - 0.5, 1, 1);
                    }
                }
            }
        }

        // Clase mejorada para partículas
        class Particle {
            constructor(x, y, color = '#FFD700') {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4 - 2;
                this.life = 60 + Math.random() * 60;
                this.maxLife = this.life;
                this.size = 2 + Math.random() * 4;
                this.color = color;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.03; // gravedad
                this.vx *= 0.99; // resistencia del aire
                this.life--;
            }

            draw() {
                if (this.life <= 0) return;
                
                const alpha = this.life / this.maxLife;
                ctx.save();
                ctx.globalAlpha = alpha;
                
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
                gradient.addColorStop(0, this.color);
                gradient.addColorStop(1, this.color + '00');
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
                ctx.restore();
            }

            isDead() {
                return this.life <= 0;
            }
        }

        // Inicializar flores por defecto
        function initFlowers() {
            flowers = [];
            const types = ['girasol', 'rosa', 'tulipan', 'margarita'];
            
            const positions = [
                {x: 400, y: 550, size: 1.2},
                {x: 350, y: 530, size: 1.0},
                {x: 450, y: 540, size: 1.1},
                {x: 320, y: 500, size: 0.9},
                {x: 480, y: 510, size: 0.95},
                {x: 380, y: 480, size: 0.85},
                {x: 420, y: 490, size: 0.9}
            ];
            
            positions.forEach((pos, index) => {
                const type = types[index % types.length];
                flowers.push(new Flower(pos.x, pos.y, type, pos.size));
            });
            
            updateFlowerCounter();
        }

        // Función de animación principal
        function animate() {
            if (!isAnimating) return;
            
            // Limpiar canvas con efecto fade
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            time++;
            
            // Actualizar y dibujar flores
            flowers.forEach(flower => {
                flower.update();
                flower.draw();
            });
            
            // Generar partículas ambientales ocasionales
            if (Math.random() < 0.05 && flowers.length > 0) {
                const flower = flowers[Math.floor(Math.random() * flowers.length)];
                if (!flower.growing) {
                    particles.push(new Particle(
                        flower.x + (Math.random() - 0.5) * 30, 
                        flower.y - flower.stemHeight,
                        flower.petalColor
                    ));
                }
            }
            
            // Actualizar y dibujar partículas
            particles = particles.filter(particle => {
                particle.update();
                particle.draw();
                return !particle.isDead();
            });
            
            animationId = requestAnimationFrame(animate);
        }

        // Mostrar indicador de crecimiento
        function showGrowingIndicator(x, y, type) {
            const indicator = document.createElement('div');
            indicator.className = 'growing-indicator';
            indicator.textContent = flowerConfigs[type].emoji;
            indicator.style.left = x + 'px';
            indicator.style.top = y + 'px';
            
            document.body.appendChild(indicator);
            
            setTimeout(() => {
                document.body.removeChild(indicator);
            }, 800);
        }

        // Actualizar contador de flores
        function updateFlowerCounter() {
            document.getElementById('flowerCount').textContent = flowers.length;
            document.getElementById('currentType').textContent = flowerConfigs[selectedFlowerType].name;
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', function() {
            // Selector de tipos de flores
            document.querySelectorAll('.flower-type').forEach(element => {
                element.addEventListener('click', function() {
                    // Remover selección anterior
                    document.querySelectorAll('.flower-type').forEach(el => el.classList.remove('selected'));
                    
                    // Seleccionar nuevo tipo
                    this.classList.add('selected');
                    selectedFlowerType = this.dataset.flower;
                    updateFlowerCounter();
                });
            });
            
            // Click en canvas para plantar flor
            canvas.addEventListener('click', (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                // Agregar nueva flor del tipo seleccionado
                const size = 0.8 + Math.random() * 0.4;
                const newFlower = new Flower(x, y + 100, selectedFlowerType, size);
                flowers.push(newFlower);
                
                // Mostrar indicador
                showGrowingIndicator(e.clientX, e.clientY, selectedFlowerType);
                
                // Actualizar contador
                updateFlowerCounter();
                
                // Crear burst de partículas
                for (let i = 0; i < 8; i++) {
                    particles.push(new Particle(x + (Math.random() - 0.5) * 20, y - 20, flowerConfigs[selectedFlowerType].colors.petal[0]));
                }
            });
            
            // Inicializar
            initFlowers();
            animate();
        });

        // Funciones para los botones
        function regenerateFlowers() {
            initFlowers();
            particles = [];
        }

        function toggleAnimation() {
            isAnimating = !isAnimating;
            if (isAnimating) {
                animate();
            } else if (animationId) {
                cancelAnimationFrame(animationId);
            }
        }

        function changeBackground() {
            currentBg = (currentBg + 1) % backgroundColors.length;
            const colors = backgroundColors[currentBg];
            document.body.style.background = `linear-gradient(135deg, ${colors[0]} 0%, ${colors[1]} 50%, ${colors[2]} 100%)`;
        }

        function clearGarden() {
            flowers = [];
            particles = [];
            updateFlowerCounter();
        }
    </script>
</body>
</html>
